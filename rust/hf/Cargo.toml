[package]
name = "hf"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"] # Necessary for WASM

[[bin]]
name = "hf-cli"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.8"
libm = "0.2.15"
log = "0.4.29"
ndarray = "0.17.1"
nalgebra = "0.30.1"
serde = { version = "1.0", features = ["derive"] } 
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndarray-linalg = { version = "0.18.0", features = ["openblas-static"] }
rayon = "1.11.0"


[profile.release]
opt-level = 3
lto = true
